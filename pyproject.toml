[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-analysis"
version = "0.1.0"
description = "Reproducible BRISC 2D and BraTS 3D brain-tumor analysis pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
brats = ["einops>=0.7", "nibabel>=5", "monai>=1.3", "scipy>=1.10"]
nnunet = ["nnunetv2>=2.4", "nibabel>=5", "scipy>=1.10"]
integrated = [
  "nibabel>=5",
  "einops>=0.7",
  "monai>=1.3",
  "scipy>=1.10",
  "streamlit>=1.35",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["src*", "integrated_pipeline*", "pipeline*"]
exclude = ["integrated_pipeline.tests*"]
